<app-page-header
  title="Inventario"
  subtitle="Control de stock, lotes, costos y alertas de abastecimiento"
  badge="Abastecimiento"
/>

<section class="kpi-grid">
  <app-kpi-card
    title="Items en catalogo"
    [value]="items().length.toString()"
    helpText="Referencias activas"
  />
  <app-kpi-card
    title="Stock critico"
    [value]="criticos().toString()"
    helpText="Requieren compra urgente"
  />
</section>

<section class="panel table-wrapper">
  <table>
    <thead>
      <tr>
        <th>SKU</th>
        <th>Producto</th>
        <th>Stock</th>
        <th>Minimo</th>
        <th>Costo</th>
        <th>Lote</th>
      </tr>
    </thead>
    <tbody>
      @for (item of items(); track item.sku) {
        <tr [ngClass]="{ critico: item.stockActual <= item.stockMinimo }">
          <td>{{ item.sku }}</td>
          <td>{{ item.nombre }}</td>
          <td>{{ item.stockActual }}</td>
          <td>{{ item.stockMinimo }}</td>
          <td>{{ item.costoUnitario | currency: 'COP':'symbol-narrow':'1.0-0' }}</td>
          <td>{{ item.lote }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
